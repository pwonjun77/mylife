<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIMING NOTE</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f7f9;
            color: #1a1a1a;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .app-container {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 24px;
            box-sizing: border-box;
            border: 1px solid #eaeaea;
        }
        h1 {
            font-size: 22px;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
            font-weight: 800;
        }
        .card {
            background: #fafafc;
            border: 1px solid #f0f0f3;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 16px;
        }
        .card-title {
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 10px;
            text-transform: uppercase;
            color: #666666;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-content {
            font-size: 14px;
            line-height: 1.6;
            color: #333333;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #1a1a1a;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        button:hover {
            background: #333333;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            box-sizing: border-box;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            background: #fff;
            text-align: center;
        }
        .hidden { display: none !important; }
        .tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #f0f0f3;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: 600;
            color: #444;
        }
        .feedback-btns {
            display: flex;
            gap: 8px;
        }
        .feedback-btns button {
            margin-top: 6px;
            font-size: 13px;
            padding: 10px;
            background: #f0f0f3;
            color: #1a1a1a;
        }
        .feedback-btns button:hover {
            background: #e2e2e6;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>✨ Timing Note</h1>
    
    <!-- 온보딩 섹션 -->
    <div id="onboarding-section" class="card">
        <div class="card-title">🐾 Profile Setup</div>
        <div class="card-content">
            <label style="font-size: 12px; color: #777; display:block; margin-bottom:6px;">생년월일을 선택해주세요</label>
            <input type="date" id="birth-date" value="1977-03-24">
            <button type="button" onclick="initApp()">타이밍 엔진 구동하기</button>
        </div>
    </div>

    <!-- 메인 대시보드 -->
    <div id="main-section" class="hidden">
        <!-- 컴패니언 아바타 말풍선 카드 -->
        <div class="card" style="display: flex; align-items: center; gap: 14px;">
            <div style="width: 48px; height: 48px; min-width: 48px; border: 2px solid #1a1a1a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; background: #ffffff;">🍀</div>
            <div style="flex: 1;">
                <div style="font-size: 11px; font-weight: 700; color: #666; margin-bottom: 2px;">타이밍 메이트</div>
                <div style="font-size: 13px; line-height: 1.4;" id="companion-speech">
                    환영해요! 오늘의 맞춤 에너지를 분석해 두었어요.
                </div>
            </div>
        </div>

        <!-- 모닝 브리핑 카드 -->
        <div class="card">
            <div class="card-title">☀️ Today's Briefing</div>
            <div class="card-content" id="briefing-text"></div>
        </div>

        <!-- 저녁 디브리프 카드 -->
        <div class="card">
            <div class="card-title">🌙 Evening Check-in</div>
            <div class="card-content">
                <p style="margin-top: 0; font-size: 13px;">오늘 예보처럼 은근히 바쁘거나 뜻대로 안 풀린 순간이 있었나요?</p>
                <div class="feedback-btns">
                    <button type="button" onclick="handleFeedback('yes')">맞아요, 변동이 있었어요 😅</button>
                    <button type="button" onclick="handleFeedback('no')">아니요, 평온했어요 ✨</button>
                </div>
                <p id="feedback-result" style="margin-top: 12px; font-size: 13px; font-weight: 600; color: #555;"></p>
            </div>
        </div>

        <!-- 프로필 재설정 버튼 -->
        <button type="button" onclick="resetProfile()" style="background: transparent; color: #888; border: 1px dashed #ccc; font-size: 12px; padding: 10px; margin-top: 5px;">
            ⚙️ 생년월일 다시 설정하기
        </button>
    </div>
</div>

<script>
    const stems = ['갑', '을', '병', '정', '무', '기', '경', '신', '임', '계'];
    const branches = ['자', '축', '인', '묘', '진', '사', '오', '미', '신', '유', '술', '해'];

    const wackyPrescriptions = [
        "편의점 구석의 가장 안 팔릴 것 같은 초코바를 사서 한 입 먹고 남은 건 우주에 기부하기 🍫",
        "방 안에서 뒤로 다섯 걸음 걸어가며 오늘의 재수를 후진으로 밀어내기 🚶‍♂️",
        "스마트폰 배경화면을 기본 이미지로 1시간 동안 바꿔놓고 디지털 자연인 되기 🌿",
        "지나가던 비둘기가 내 기운을 훔쳐갔다고 마음속으로 가볍게 억지 부리기 🐦",
        "차가운 보리차를 한 번에 원샷하고 내 안의 불순물이 전부 증발했다고 선언하기 🧊",
        "오늘의 모든 꼬임은 지구 자기장 탓으로 돌리고 냉동실 아이스크림 영접하기 🍦",
        "스마트폰에서 1년 동안 안 쓴 앱 하나를 삭제하며 짜증 한 조각 함께 영구 삭제하기 🗑️",
        "자리에서 벌떡 일어나 제자리에서 한 바퀴 돌며 공간의 흐름을 강제로 비틀기 💫",
        "포장이 가장 요란한 신제품 과자를 사서 고개 가젓기로 액운 쫓기 🍿",
        "오늘 내 왼쪽 어깨를 강하게 당기는 달의 인력 탓을 하며 당 충전하기 🌕",
        "책상 위에 있는 물건 위치를 좌우 반전시키며 시공간 좌표를 교란시키기 📐",
        "거울을 보며 '오늘 내 일진은 서쪽으로 구부러졌다'고 당당하게 속삭이기 🪞"
    ];

    function parseLocalDate(dateStr) {
        if (!dateStr) return new Date();
        const parts = dateStr.split('-');
        if (parts.length !== 3) return new Date();
        return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    }

    function getGanji(date) {
        const baseDate = new Date(1900, 0, 1);
        const diffTime = date.getTime() - baseDate.getTime();
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        const startIndex = 10;
        const index = (startIndex + diffDays) % 60;
        
        const sIdx = ((index % 10) + 10) % 10;
        const bIdx = ((index % 12) + 12) % 12;
        
        return {
            stem: stems[sIdx],
            branch: branches[bIdx],
            fullName: stems[sIdx] + branches[bIdx]
        };
    }

    const safeStorage = {
        getItem(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        },
        setItem(key, value) {
            try { localStorage.setItem(key, value); } catch (e) {}
        },
        removeItem(key) {
            try { localStorage.removeItem(key); } catch (e) {}
        }
    };

    function initApp() {
        const birthDateInput = document.getElementById('birth-date');
        const birthDateStr = birthDateInput ? birthDateInput.value : '';
        
        if (!birthDateStr) {
            alert('생년월일을 입력해주세요.');
            return;
        }

        const birthDate = parseLocalDate(birthDateStr);
        const today = new Date();
        
        if (birthDate > today) {
            alert('생년월일은 오늘보다 미래일 수 없습니다.');
            return;
        }
        
        safeStorage.setItem('user_birth', birthDateStr);
        
        document.getElementById('onboarding-section').classList.add('hidden');
        document.getElementById('main-section').classList.remove('hidden');
        
        generateUniqueBriefing(birthDateStr);
    }

    function resetProfile() {
        safeStorage.removeItem('user_birth');
        document.getElementById('main-section').classList.add('hidden');
        document.getElementById('onboarding-section').classList.remove('hidden');
        document.getElementById('feedback-result').innerText = '';
    }

    function generateUniqueBriefing(birthStr) {
        const birthDate = parseLocalDate(birthStr);
        const userGanji = getGanji(birthDate);
        const todayGanji = getGanji(new Date());

        const userStem = userGanji.stem;
        const todayStem = todayGanji.stem;

        // 개인별 일간 vs 일진 상호작용 분석 로직
        let message = "";
        if (userStem === todayStem) {
            message = `나의 일간(${userStem})과 오늘의 기운(${todayGanji.fullName})이 동일하게 겹치는 날입니다. 내 주관과 에너지가 아주 강해지니 주도적으로 업무나 일정을 리드하기에 최적입니다.`;
        } else if ((['갑','을'].includes(userStem) && ['병','정'].includes(todayStem)) ||
                   (['병','정'].includes(userStem) && ['무','기'].includes(todayStem)) ||
                   (['무','기'].includes(userStem) && ['경','신'].includes(todayStem)) ||
                   (['경','신'].includes(userStem) && ['임','계'].includes(todayStem)) ||
                   (['임','계'].includes(userStem) && ['갑','을'].includes(todayStem))) {
            message = `나의 본원(${userStem})이 오늘의 일진(${todayGanji.fullName})으로 분출되는 활발한 흐름입니다. 창의적인 아이디어를 내거나 표현하기 좋으나 체력 소모에 유의하세요.`;
        } else if ((['병','정'].includes(userStem) && ['갑','을'].includes(todayStem)) ||
                   (['무','기'].includes(userStem) && ['병','정'].includes(todayStem)) ||
                   (['경','신'].includes(userStem) && ['무','기'].includes(todayStem)) ||
                   (['임','계'].includes(userStem) && ['경','신'].includes(todayStem)) ||
                   (['갑','을'].includes(userStem) && ['임','계'].includes(todayStem))) {
            message = `오늘의 일진(${todayGanji.fullName})이 나의 기운(${userStem})을 뒷받침해 주는 충전의 날입니다. 주변의 도움을 받거나 학습, 휴식을 취하기에 유리합니다.`;
        } else {
            message = `오늘의 일진(${todayGanji.fullName})과 나의 일간(${userStem}) 사이에 가벼운 긴장과 변동성이 형성되는 날입니다. 중요한 결정은 서두르지 말고 오후에 차분히 점검하세요.`;
        }

        // 최근 8회 중복 방지 필터
        let history = [];
        try {
            history = JSON.parse(safeStorage.getItem('prescription_history') || '[]');
            if (!Array.isArray(history)) history = [];
        } catch (e) {
            history = [];
        }
        
        let availableIndices = [];
        for (let i = 0; i < wackyPrescriptions.length; i++) {
            if (!history.includes(i)) {
                availableIndices.push(i);
            }
        }

        if (availableIndices.length === 0) {
            history = [];
            availableIndices = wackyPrescriptions.map((_, i) => i);
        }

        const randomIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
        const selectedPrescription = wackyPrescriptions[randomIndex];

        history.push(randomIndex);
        if (history.length > 8) {
            history.shift();
        }
        safeStorage.setItem('prescription_history', JSON.stringify(history));

        const speechEl = document.getElementById('companion-speech');
        if (speechEl) {
            speechEl.innerText = `${userStem}일간 맞춤 에너지 분석을 완료했어요!`;
        }

        const briefingEl = document.getElementById('briefing-text');
        if (briefingEl) {
            briefingEl.innerHTML = `
                <div class="tag">🍀 나의 일간: ${userStem}일 / 오늘의 일진: ${todayGanji.fullName}</div><br>
                <strong>에너지 리포트:</strong> ${message}<br><br>
                <strong>🎁 오늘의 맞춤 액땜 처방전:</strong><br><span style="color: #0056b3; display:inline-block; margin-top:4px;">${selectedPrescription}</span>
            `;
        }
    }

    function handleFeedback(type) {
        const resultEl = document.getElementById('feedback-result');
        const speechEl = document.getElementById('companion-speech');
        
        if (type === 'yes') {
            if (resultEl) resultEl.innerText = "😅 우주 탓 디펜스 발동 완료! 내일의 흐름에 유쾌하게 반영될게요.";
            if (speechEl) speechEl.innerText = "오늘도 수고 많으셨어요! 내일은 훨씬 산뜻한 타이밍이 될 거예요.";
        } else {
            if (resultEl) resultEl.innerText = "✨ 평온하고 완벽한 타이밍의 하루였군요! 멋져요.";
            if (speechEl) speechEl.innerText = "평온한 하루를 보내셨다니 저도 기분이 좋네요!";
        }
    }

    // 자동 로드 처리
    window.addEventListener('DOMContentLoaded', function() {
        const savedBirth = safeStorage.getItem('user_birth');
        if (savedBirth) {
            const birthInput = document.getElementById('birth-date');
            if (birthInput) birthInput.value = savedBirth;
            
            document.getElementById('onboarding-section').classList.add('hidden');
            document.getElementById('main-section').classList.remove('hidden');
            generateUniqueBriefing(savedBirth);
        }
    });
</script>

</body>
</html>
